# App Name
spring.application.name=snippit-ai-chatbot-backend
# OpenRouter endpoint override
spring.ai.openai.base-url=https://openrouter.ai/api/v1
# API key mapped from environment variables
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
# OpenRouter free-tier model selection
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL}
#inclusionai/ling-3.0-flash-vl:free
# CORS Configuration
cors.allowed-origins=*

